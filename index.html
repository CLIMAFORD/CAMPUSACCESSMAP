        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.update();
                    }, 10);
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }

        function scheduleMidnightCleanup() {
            var now = new Date();
            var nextMidnight = new Date(now);
            nextMidnight.setDate(now.getDate() + 1);
            nextMidnight.setHours(0,0,0,0);
            var ms = nextMidnight - now;

                // remove any markers not created today
                var start = new Date(); start.setHours(0,0,0,0);
                Object.keys(issueMeta).forEach(function(id) {
                    var meta = issueMeta[id];
                    if (!meta || !meta.createdAt) return;
                    if (meta.createdAt < start) {

                            map.removeLayer(issueMarkers[id]);
                            delete issueMarkers[id];
                        }

            }
            // avoid loading twice
            if (document.getElementById('google-maps-api-script')) return;
            var s = document.createElement('script');
            s.id = 'google-maps-api-script';
            s.async = true; s.defer = true;
            s.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(key) + '&libraries=places&callback=initGoogleMapsServices';
            s.onerror = function() { alert('Failed to load Google Maps script — check API key and network.'); };
            document.head.appendChild(s);
        }

        // Called by the Google Maps script once loaded
        window.initGoogleMapsServices = function() {
            try {
                googleDirectionsService = new google.maps.DirectionsService();
                // wire up autocomplete inputs (if present)
                var originInput = document.getElementById('gm-origin');
                var destInput = document.getElementById('gm-destination');
                if (originInput) {
                    googleAutocompleteOrigin = new google.maps.places.Autocomplete(originInput);
                    googleAutocompleteOrigin.addListener('place_changed', function() {
                        var p = googleAutocompleteOrigin.getPlace();
                        if (p && p.geometry && p.geometry.location) {
                            var lat = p.geometry.location.lat(), lng = p.geometry.location.lng();
                            var latlng = L.latLng(lat, lng);
                            map.setView(latlng, 16);
                            if (googleOriginMarker) { googleOriginMarker.setLatLng(latlng); } else { googleOriginMarker = L.marker(latlng).addTo(map); }
                            originInput.value = p.formatted_address || (lat.toFixed(6) + ', ' + lng.toFixed(6));
                        }
                    });
                }
                if (destInput) {
                    googleAutocompleteDestination = new google.maps.places.Autocomplete(destInput);
                    googleAutocompleteDestination.addListener('place_changed', function() {
                        var p = googleAutocompleteDestination.getPlace();
                        if (p && p.geometry && p.geometry.location) {
                            var lat = p.geometry.location.lat(), lng = p.geometry.location.lng();
                            var latlng = L.latLng(lat, lng);
                            map.setView(latlng, 16);
                            if (googleDestinationMarker) { googleDestinationMarker.setLatLng(latlng); } else { googleDestinationMarker = L.marker(latlng).addTo(map); }
                            destInput.value = p.formatted_address || (lat.toFixed(6) + ', ' + lng.toFixed(6));
                            // auto-run route if origin already present
                            if (googleOriginMarker) calculateGoogleRoute();
                        }
                    });
                }
                window.useGoogleActive = true;
            } catch (err) {
                console.error('initGoogleMapsServices error', err);
            }
        };

        // Decode an encoded polyline returned by Google DirectionsService
        function decodePolyline(encoded) {
            if (!encoded) return [];
            var points = [];
            var index = 0, len = encoded.length;
            var lat = 0, lng = 0;
            while (index < len) {
                var b, shift = 0, result = 0;
                do { b = encoded.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
                var dlat = ((result & 1) ? ~(result >> 1) : (result >> 1));
                lat += dlat;
                shift = 0; result = 0;
                do { b = encoded.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
                var dlng = ((result & 1) ? ~(result >> 1) : (result >> 1));
                lng += dlng;
                points.push([lat / 1e5, lng / 1e5]);
            }
            return points;
        }

        // Calculate directions using Google and draw a Leaflet polyline (also shows travel time)
        function calculateGoogleRoute() {
            if (!window.useGoogleActive) return;
            if (!googleDirectionsService) { alert('Google services are not initialized. Save a valid API key in Routing settings.'); return; }
            var originVal = document.getElementById('gm-origin').value;
            var destVal = document.getElementById('gm-destination').value;
            if (!originVal || !destVal) { alert('Please provide both origin and destination (or click on the map).'); return; }

            // Map routing-mode to Google travel mode
            var mode = document.getElementById('routing-mode').value;
            var travelMode = google.maps.TravelMode.DRIVING;
            if (mode === 'foot-walking') travelMode = google.maps.TravelMode.WALKING;
            else if (mode === 'cycling-regular') travelMode = google.maps.TravelMode.BICYCLING;
            else if (mode === 'driving-car') travelMode = google.maps.TravelMode.DRIVING;

            googleDirectionsService.route({
                origin: originVal,
                destination: destVal,
                travelMode: travelMode,
                provideRouteAlternatives: false
            }, function(response, status) {
                if (status === 'OK' && response && response.routes && response.routes.length) {
                    clearGoogleRoute();
                    var route = response.routes[0];
                    var enc = route.overview_polyline && route.overview_polyline.points;
                    var coords = decodePolyline(enc);
                    if (coords && coords.length) {
                        var latlngs = coords.map(function(p) { return [p[0], p[1]]; });
                        var poly = L.polyline(latlngs, {color: '#ff5722', weight: 5, opacity: 0.9}).addTo(googleRouteLayer);
                        map.fitBounds(poly.getBounds(), {padding: [40,40]});
                    }
                    // show origin/destination markers
                    var leg = route.legs && route.legs[0];
                    if (leg) {
                        if (!googleOriginMarker) googleOriginMarker = L.marker([leg.start_location.lat(), leg.start_location.lng()]).addTo(map);
                        else googleOriginMarker.setLatLng([leg.start_location.lat(), leg.start_location.lng()]);
                        if (!googleDestinationMarker) googleDestinationMarker = L.marker([leg.end_location.lat(), leg.end_location.lng()]).addTo(map);
                        else googleDestinationMarker.setLatLng([leg.end_location.lat(), leg.end_location.lng()]);
                        document.getElementById('gm-travel-info').innerText = (leg.duration && leg.duration.text ? leg.duration.text : '') + ' • ' + (leg.distance && leg.distance.text ? leg.distance.text : '');
                    }
                    // update provider label
                    var el = document.getElementById('routing-provider'); if (el) el.innerText = 'Google';
                } else {
                    console.error('Google Directions error', status, response);
                    alert('Google Directions failed: ' + status);
                }
            });
        }

        function clearGoogleRoute() {
            try {
                googleRouteLayer.clearLayers();
                if (googleOriginMarker) { try { map.removeLayer(googleOriginMarker); } catch(e){} googleOriginMarker = null; }
                if (googleDestinationMarker) { try { map.removeLayer(googleDestinationMarker); } catch(e){} googleDestinationMarker = null; }
                var info = document.getElementById('gm-travel-info'); if (info) info.innerText = '';
            } catch (err) { console.error('clearGoogleRoute', err); }
        }

        /* ---------------- Crowd / Traffic Heatmap (Leaflet.heat + Firebase Realtime DB) ---------------- */
        var heatmapLayer = null;
        var heatmapListener = null;

        function createOrUpdateHeatmap(points) {
            if (heatmapLayer) {
                heatmapLayer.setLatLngs(points);
            } else {
                heatmapLayer = L.heatLayer(points, {
                    radius: 25,
                    blur: 15,
                    gradient: {0.2: 'blue', 0.4: 'cyan', 0.6: 'lime', 0.8: 'yellow', 1.0: 'red'}
                }).addTo(map);
            }
        }

        document.getElementById('heatmap-toggle').addEventListener('change', function(e) {
            if (e.target.checked) {
                var ref = firebase.database().ref('userLocations');
                heatmapListener = function(snapshot) {
                    var pts = [];
                    snapshot.forEach(function(child) {
                        var d = child.val();
                        if (d && d.lat && d.lng) pts.push([d.lat, d.lng, 1]);
                    });
                    createOrUpdateHeatmap(pts);
                };
                ref.on('value', heatmapListener, function(err) { console.error('Heatmap DB error', err); });
            } else {
                if (heatmapLayer) { map.removeLayer(heatmapLayer); heatmapLayer = null; }
                if (heatmapListener) {
                    firebase.database().ref('userLocations').off('value', heatmapListener);
                    heatmapListener = null;
                }
            }
        });

        /* ---------------- Share My Location (optional) ---------------- */
        var shareWatchId = null;
        var shareBtn = document.getElementById('share-location');
        shareBtn.addEventListener('click', function() {
            if (!navigator.geolocation) return alert('Geolocation not supported');
            if (shareWatchId) {
                navigator.geolocation.clearWatch(shareWatchId);
                shareWatchId = null;
                shareBtn.innerText = 'Share My Location';
                return;
            }
            shareBtn.innerText = 'Sharing...';
            shareWatchId = navigator.geolocation.watchPosition(function(pos) {
                var uid = (auth && auth.currentUser && auth.currentUser.uid) ? auth.currentUser.uid : (window.currentUserUid || 'anonymous');
                var lat = pos.coords.latitude;
                var lng = pos.coords.longitude;
                try {
                    firebase.database().ref('userLocations/' + uid).set({ lat: lat, lng: lng, timestamp: firebase.database.ServerValue ? firebase.database.ServerValue.TIMESTAMP : Date.now() });
                } catch (err) {
                    console.error('Failed to write location to Realtime DB', err);
                }
            }, function(err) {
                console.error('watchPosition error', err);
                alert('Could not share location: ' + err.message);
                shareBtn.innerText = 'Share My Location';
                if (shareWatchId) { navigator.geolocation.clearWatch(shareWatchId); shareWatchId = null; }
            }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 });
        });

        </script>
    </body>
</html>
